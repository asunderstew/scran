<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Helth">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Helth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Big photo cards, heavy display type, black and white only, light and dark. */
:root{
  --bg:#F5F5F5; --card:#FFFFFF; --ink:#0A0A0A; --mute:#6B6B6B; --line:#E2E2E2;
  --accent:#0A0A0A; --accent-ink:#FFFFFF; --pop:#0A0A0A; --pop-ink:#FFFFFF; --good:#0A0A0A; --good-ink:#FFFFFF;
  --t0:#ECECEC; --t1:#E0E0E0; --t2:#D3D3D3; --t3:#F2F2F2; --shade:rgba(0,0,0,.55);
  --display:"Bricolage Grotesque","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#141414; --ink:#F5F5F5; --mute:#9A9A9A; --line:#2A2A2A;
  --accent:#F5F5F5; --accent-ink:#0A0A0A; --pop:#F5F5F5; --pop-ink:#0A0A0A; --good:#F5F5F5; --good-ink:#0A0A0A;
  --t0:#1E1E1E; --t1:#292929; --t2:#333333; --t3:#242424; --shade:rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#141414; --ink:#F5F5F5; --mute:#9A9A9A; --line:#2A2A2A;
  --accent:#F5F5F5; --accent-ink:#0A0A0A; --pop:#F5F5F5; --pop-ink:#0A0A0A; --good:#F5F5F5; --good-ink:#0A0A0A;
  --t0:#1E1E1E; --t1:#292929; --t2:#333333; --t3:#242424; --shade:rgba(0,0,0,.7); color-scheme:dark;}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:24px}
/* tabs */
#tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;border-radius:12px;position:relative}
#tabs button.on{color:var(--ink)}
#tabs button.on svg{stroke:var(--accent)}
#tabs .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:17px;padding:0 4px;font-variant-numeric:tabular-nums}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px}
.logo{font:800 34px/1 var(--display);letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.vh{padding:18px 16px 10px;font-size:32px}
.sub{color:var(--mute);font-size:14px}
/* hero */
.hero{margin:10px 16px 0;border-radius:26px;overflow:hidden;position:relative;display:block;background:var(--card);cursor:pointer}
.hero .pic{width:100%;aspect-ratio:4/4.4;object-fit:cover;display:block}
.hero .txt{position:absolute;left:0;right:0;bottom:0;padding:70px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff}
.hero h2{font-size:34px;margin-top:8px}
.hero .meta{color:rgba(255,255,255,.85);margin-top:6px}
.tagpop{display:inline-block;background:var(--pop);color:var(--pop-ink);font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:7px}
/* dietary tags */
.bdgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.bdg.gf{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bdg{font:700 10px/1 var(--body);letter-spacing:.04em;border:1.5px solid var(--line);border-radius:6px;padding:3px 5px;color:var(--mute)}
.dts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.dt{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.dt b{display:grid;place-items:center;min-width:26px;height:22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;letter-spacing:.02em;padding:0 6px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:8px 0}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:16px;height:16px}
/* rails + cards */
.rail-h{display:flex;align-items:baseline;justify-content:space-between;padding:26px 16px 10px;gap:12px}
.rail-h h2{font-size:24px}
.rail-h button{font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 62%;max-width:250px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:6px 16px}
.card{cursor:pointer;min-width:0}
.cpic{position:relative;border-radius:var(--r);overflow:hidden;background:var(--line)}
.pic{width:100%;aspect-ratio:1/1.12;object-fit:cover;display:block;background:var(--line)}
.nop{background:var(--c);overflow:hidden;padding:12px;display:flex;align-items:flex-end}
.nop span{font:800 30px/.92 var(--display);letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);opacity:.8;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card h3{font-size:18px;margin:9px 2px 3px;line-height:1.08}
.meta{font-size:13px;color:var(--mute);margin:0 2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);color:#0A0A0A;display:grid;place-items:center}
.heart.on{background:var(--accent);color:var(--accent-ink)}
.heart.on svg{fill:currentColor}
.time{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--line);color:var(--ink)}
.pill.g{background:var(--pop);color:var(--pop-ink)}
.banner{margin:16px;padding:16px;border-radius:var(--r);background:var(--pop);color:var(--pop-ink);display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner b{font:800 20px/1.05 var(--display)}
.banner p{font-size:14px;margin-top:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 20px;font-weight:700;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.a{background:var(--accent);color:var(--accent-ink)}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.s{padding:9px 14px;font-size:14px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.pad{padding:0 16px}
/* search */
.sbox{margin:0 16px;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 14px}
.sbox input{flex:1;border:0;background:none;outline:0;padding:14px 0;min-width:0}
.seg{display:flex;margin:12px 16px 0;background:var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink)}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:8px}
.match{font-size:12.5px;color:var(--mute);margin:3px 2px 0}
.match b{color:var(--good)}
/* overlays */
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov[hidden],#sheet[hidden]{display:none}
.dhero{position:relative}
.dhero .pic{aspect-ratio:1/.9;border-radius:0 0 28px 28px}
.dhero .nop span{font-size:54px}
.dbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:12px 14px;margin-bottom:-66px;pointer-events:none}
.dbar button{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.94);color:#0A0A0A;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.dbar .on{background:var(--accent);color:#fff}.dbar .on svg{fill:currentColor}
.dbody{padding:18px 16px 110px}
.dbody h1{font-size:38px}
.dbody .desc{margin-top:10px;color:var(--mute)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 6px}
.acts button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:5px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;gap:10px}
.sec h2{font-size:26px}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.step span{min-width:76px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
ul.ing{list-style:none;padding:0;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
ul.ing li{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
ul.ing li:last-child{border-bottom:0}
ul.ing li.gh{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.03em;cursor:default;background:var(--bg)}
ul.ing li.done{color:var(--mute);text-decoration:line-through}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);margin-top:1px;display:grid;place-items:center}
.done>.box,.box.on{background:var(--good);border-color:var(--good)}
.done>.box::after,.box.on::after{content:"";width:10px;height:5px;border:2.5px solid var(--good-ink);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
ol.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:10px}
ol.steps li::before{content:counter(s);font:800 26px/1 var(--display);color:var(--accent)}
ol.steps li.gh{display:block;font:800 16px var(--display);text-transform:uppercase;letter-spacing:.03em;counter-increment:none}
ol.steps li.gh::before{content:none}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px}
textarea,.field{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:0}
textarea:focus,.field:focus,.sbox:focus-within{border-color:var(--ink)}
.cta{position:sticky;bottom:0;padding:12px 16px 14px;background:linear-gradient(transparent,var(--bg) 30%);margin-top:-90px;z-index:3}
.credit{font-size:12.5px;color:var(--mute);margin-top:22px}
/* cook mode */
#cook{display:flex;flex-direction:column;z-index:8}
#cook[hidden]{display:none}
.ctop{display:flex;align-items:center;gap:12px;padding:14px 16px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.cmain{flex:1;overflow-y:auto;padding:10px 20px 20px}
.cnum{font:800 15px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ctext{font:600 27px/1.22 var(--display);letter-spacing:-.01em;margin-top:12px}
.timer{margin-top:22px;display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.timer b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;flex:1}
.timer.end{background:var(--pop);color:var(--pop-ink);border-color:var(--pop)}
.cnav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px 16px}
.cnav .btn{padding:17px}
/* sheet */
#sheet{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.5)}
.panel{background:var(--bg);border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding:8px 16px 22px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.prog i{transition:none}}
.panel .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.panel h2{font-size:28px;margin-bottom:6px}
.panel h4{font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 2px}
.pick{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pick .pic{width:54px;height:54px;aspect-ratio:auto;border-radius:12px;flex:none;padding:4px}
.pick .pic span{font-size:9px;-webkit-line-clamp:4}
.pick b{display:block;line-height:1.2}
.pick small{color:var(--mute)}
/* plan */
.day{margin:0 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.day.today{border-color:var(--ink);border-width:2px}
.day header{display:flex;justify-content:space-between;align-items:center}
.day header b{font:800 19px var(--display)}
.day header span{color:var(--mute);font-size:13px;margin-left:6px;font-weight:500}
.add{color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:6px 0}
.add svg{width:17px;height:17px}
.ent{display:flex;gap:10px;align-items:center;margin-top:10px}
.ent .pic{width:50px;height:50px;aspect-ratio:auto;border-radius:11px;flex:none;padding:4px}
.ent .pic span{font-size:8px;-webkit-line-clamp:4}
.ent div{flex:1;min-width:0;cursor:pointer}
.ent b{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent small{color:var(--mute)}
.ent .rm{color:var(--mute);width:34px;height:34px;display:grid;place-items:center}
.ent .rm svg{width:18px;height:18px}
.wk{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
.wk b{font-weight:700}
/* list */
.aisle{margin:18px 16px 6px;font:800 15px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.items{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:last-child{border-bottom:0}
.item div{flex:1;min-width:0}
.item small{display:block;color:var(--mute);font-size:13px}
.item.done b,.item.done span.t{text-decoration:line-through;color:var(--mute);font-weight:400}
.item b{font-weight:600}
form.addrow{display:flex;gap:8px;margin:0 16px}
#toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:20;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
a{color:inherit}
.pill.p{background:var(--ink);color:var(--bg)}
.mac{font-variant-numeric:tabular-nums;white-space:nowrap}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.nut div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.nut div.hi{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.nut b{display:block;font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.nut small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.day .pbar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.day .pbar i{display:block;height:100%;background:var(--good);border-radius:3px}
#app{padding-top:env(safe-area-inset-top)}
#tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.cnav{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.panel{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.cta{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.dbar,.ctop{padding-top:calc(12px + env(safe-area-inset-top))}
.banner.sync{display:block}
.banner.sync .prog{background:var(--line);margin-top:10px}
.banner.sync .prog i{background:var(--pop-ink)}
.webcard{margin:22px 16px 0;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.webcard b{font:800 20px/1.05 var(--display);display:block;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Sections"></nav>
  <div id="detail" class="ov" hidden></div>
  <div id="cook" class="ov" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast" aria-live="polite"></div>
</div>
<script src="data.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

let C=null,tick=0,wake=null,actx=null;
function startCook(){const r=R[D.id];C={id:r.id,x:D.x,i:0,steps:r.s.filter(s=>typeof s==='string'),timers:{}};$('#cook').hidden=false;drawCook();
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
  clearInterval(tick);tick=setInterval(tickTimers,500)}
function stopCook(){$('#cook').hidden=true;clearInterval(tick);try{if(wake)wake.release()}catch(e){}wake=null;C=null}
function clock(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function drawCook(){const r=R[C.id],n=C.steps.length,i=C.i,m=S.prefs.metric;let main;
  if(i===0)main=`<p class="cnum">Get ready</p><h2 style="font-size:32px;margin:10px 0 14px">${esc(r.t)}</h2><p class="sub" style="margin-bottom:10px">Tick things off as you get them out. ${servText(r,C.x)}.</p><ul class="ing">${ordIng(r).map(({l})=>typeof l==='string'?`<li data-a="tickc"><span class="box"></span><span>${esc(fmtIng(l,C.x,m))}</span></li>`:`<li class="gh">${esc(l.h)}</li>`).join('')}</ul>`;
  else{const s=fmtStep(C.steps[i-1],m),secs=stepSecs(s),t=C.timers[i];
    main=`<p class="cnum">Step ${i} of ${n}</p><p class="ctext">${esc(s)}</p>${secs?`<div class="timer ${t&&t.left<=0?'end':''}" id="timer">${ic('clock')}<b id="tclock">${t?(t.left<=0?'Done':clock(t.left)):clock(secs)}</b><button class="btn s ${t&&t.run?'o':''}" data-a="timer" data-s="${secs}">${!t?'Start timer':t.left<=0?'Reset':t.run?'Pause':'Resume'}</button></div>`:''}`}
  const others=Object.keys(C.timers).filter(k=>+k!==i&&C.timers[k].run);
  $('#cook').innerHTML=`<div class="ctop"><button class="iconbtn" data-a="closecook" aria-label="Leave cooking mode">${ic('x')}</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><i style="width:${i/n*100}%"></i></div><span class="sub" style="font-variant-numeric:tabular-nums">${i}/${n}</span></div>
  <div class="cmain" id="cmain">${main}${others.map(k=>`<p class="note" data-a="gostep" data-i="${k}" style="cursor:pointer">Timer running on step ${k}: <b id="ot${k}">${clock(C.timers[k].left)}</b></p>`).join('')}</div>
  <div class="cnav"><button class="btn o" data-a="cstep" data-o="-1" ${i===0?'disabled':''}>Back</button>${i<n?`<button class="btn a" data-a="cstep" data-o="1">${i===0?'Start':'Next step'}</button>`:`<button class="btn a" data-a="cooked">${ic('check')}Done, I cooked it</button>`}</div>`}
function tickTimers(){if(!C)return;const now=Date.now();for(const k in C.timers){const t=C.timers[k];if(!t.run)continue;t.left=(t.end-now)/1000;
    if(t.left<=0){t.run=false;t.left=0;beep();toast('Timer done for step '+k);if(+k===C.i||true)drawCook();continue}
    const el=+k===C.i?$('#tclock'):$('#ot'+k);if(el)el.textContent=clock(t.left)}}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.28);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)})}catch(e){}}

/* ---------- adapt: quick swaps and your own versions ---------- */
const SWAPS={veg:{chicken:'chickpeas or firm tofu','minced beef':'green lentils or veggie mince',beef:'portobello mushrooms',pork:'smoked tofu or jackfruit',bacon:'smoked tofu',ham:'smoked tofu',sausage:'veggie sausages',lamb:'aubergine and chickpeas',turkey:'firm tofu',duck:'king oyster mushrooms',veal:'portobello mushrooms',game:'mushrooms',salmon:'firm tofu',tuna:'chickpeas','white fish':'firm tofu or butter beans',prawns:'butter beans',anchovies:'capers',seafood:'oyster mushrooms','fish sauce':'soy sauce','chicken stock':'vegetable stock','beef stock':'vegetable stock',gelatine:'agar agar',lard:'vegetable oil'},
  dairy:{milk:'oat milk',buttermilk:'oat milk with a squeeze of lemon',cream:'oat cream','sour cream':'dairy-free yogurt','cream cheese':'dairy-free cream cheese',parmesan:'nutritional yeast',mozzarella:'dairy-free mozzarella',cheddar:'dairy-free cheddar',feta:'dairy-free feta',ricotta:'silken tofu',cheese:'dairy-free cheese',yogurt:'coconut yogurt',butter:'dairy-free spread or olive oil','ice cream':'dairy-free ice cream','condensed milk':'coconut condensed milk',pesto:'dairy-free pesto'},
  egg:{eggs:'flax eggs (1 tbsp ground flaxseed and 3 tbsp water each)',honey:'maple syrup',mayonnaise:'vegan mayo'},
  gf:{flour:'gluten-free flour',pasta:'gluten-free pasta',bread:'gluten-free bread',breadcrumbs:'gluten-free breadcrumbs','soy sauce':'tamari',couscous:'quinoa',tortillas:'corn tortillas',beer:'gluten-free beer',pastry:'gluten-free pastry',buns:'gluten-free buns',oats:'gluten-free oats'}};
const MODES={veg:['Vegetarian',['veg']],vegan:['Vegan',['veg','dairy','egg']],dairy:['Dairy free',['dairy']],gf:['Gluten free',['gf']]};
const QTY=new RegExp('^\\s*(?:~|about\\s+)?'+NUM+'(?:\\s*(?:-|–|to)\\s*'+NUM+')?\\s*(?:(?:'+UNITS+')\\b)?','i');
const toText=(arr,f)=>arr.map(l=>typeof l==='string'?f(l):'## '+l.h).join('\n');
const fromText=t=>String(t).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.startsWith('##')?{h:l.replace(/^#+\s*/,'')}:l.replace(/^(?:[-*•]|\d+[.)])\s+/,''));
function baseIngText(r,mode){const maps=mode?MODES[mode][1].map(k=>SWAPS[k]):[];let n=0;
  const t=toText(r.i,l=>{const s=fmtIng(l,D?D.x:1,S.prefs.metric),e=ident(l);let sub=null;if(e)for(const m of maps)if(m[e.k])sub=m[e.k];if(!sub)return s;n++;
    const q=s.match(QTY),qty=q?q[0].trim():'';return (qty?qty+' ':'')+sub+' (instead of '+s.slice(q?q[0].length:0).trim()+')'});return {t,n}}
let A=null;

/* ---------- shopping list ---------- */
function addToList(r,x){let n=0;for(const l of r.i){if(typeof l!=='string')continue;const e=ident(l);if(e&&e.k==='water')continue;addItem(fmtIng(l,x,S.prefs.metric),r.t,e);n++}return n}
function addItem(text,from,e){if(e===undefined)e=ident(text);
  const ex=e&&S.shop.find(i=>!i.done&&i.k===e.k);
  if(ex)ex.parts.push({t:text,r:from||''});
  else S.shop.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k:e?e.k:'',n:e?e.k:text,a:e?e.a:'X',parts:[{t:text,r:from||''}],done:false})}
function listText(){return Object.keys(AISLES).map(a=>{const it=S.shop.filter(i=>!i.done&&i.a===a);return it.length?AISLES[a].toUpperCase()+'\n'+it.map(i=>'- '+(i.parts.length>1?cap(i.n)+': '+i.parts.map(p=>p.t).join(' + '):i.parts[0].t)).join('\n'):''}).filter(Boolean).join('\n\n')}

/* ---------- plan helpers ---------- */
function planAdd(id,day,x,b){pointer(R[id]);(S.plan[day]=S.plan[day]||[]).push({id,x,b:b||0});
  const d=new Date(day+'T12:00');for(let i=1;i<=(b||0);i++){const n=new Date(d);n.setDate(d.getDate()+i);(S.plan[dk(n)]=S.plan[dk(n)]||[]).push({id,x,l:1})}save()}
function fillWeek(){const ds=days(weekStart(),7),tk=dk(noon());const used=new Set();ds.forEach(d=>(S.plan[dk(d)]||[]).forEach(e=>used.add(e.id)));
  const pool=forYou(r=>r.main&&!used.has(r.id)&&(r.p||r.mine));let n=0;
  ds.forEach(d=>{const k=dk(d);if(k<tk||(S.plan[k]||[]).length)return;const r=pool.shift();if(!r)return;planAdd(r.id,k,S.prefs.servings?S.prefs.servings/r.y:1,0);n++});
  toast(n?`Planned ${n} dinner${n===1?'':'s'}`:'Your week is already full');rerender()}

/* ---------- routing ---------- */
function go(h){try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}route(h)}
function route(h){h=(h||'').replace(/^#/,'');
  if(h.startsWith('r-')&&R[h.slice(2)]){if(!D||D.id!==h.slice(2))openRecipe(h.slice(2));return}
  $('#detail').hidden=true;D=null;
  if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render()}else if(!$('#view').innerHTML)render()}
window.addEventListener('hashchange',()=>route(location.hash));

  pconfirm(){planAdd(P.id,P.d,P.x,P.b);closeSheet();toast('Added to your plan');rerender()},
  pickfor(el){sheetPick(el.dataset.d)},
  pickadd(el){const r=R[el.dataset.id];planAdd(r.id,el.dataset.d,S.prefs.servings?S.prefs.servings/r.y:1,0);closeSheet();rerender()},
  unplan(el){const k=el.dataset.d;S.plan[k].splice(+el.dataset.i,1);if(!S.plan[k].length)delete S.plan[k];save();rerender()},
  week(el){planOff+=+el.dataset.o;render()},
  fill(){fillWeek()},
  async weeklist(){let n=0,fail=0;for(const d of days(weekStart(),7))for(const e of (S.plan[dk(d)]||[])){if(e.l||e.s||!R[e.id])continue;let r;try{r=await ensureFull(e.id)}catch(x){fail++;continue}addToList(r,e.x*((e.b||0)+1));e.s=1;n++}
    save();toast(`Ingredients for ${n} recipe${n===1?'':'s'} added`+(fail?`, ${fail} could not be loaded`:''));rerender()},
  // list
  check(el){const i=S.shop.find(x=>x.id===el.dataset.id);if(i){i.done=!i.done;save();rerender()}},
  cleardone(){S.shop=S.shop.filter(i=>!i.done);save();rerender()},
  clearlist(){sheet(`<h2>Clear the whole list?</h2><p class="sub">This removes all ${S.shop.length} items.</p><div style="height:16px"></div><div class="row"><button class="btn o" data-a="closesheet" style="flex:1">Keep it</button><button class="btn a" data-a="clearyes" style="flex:1">Clear list</button></div>`)},
  clearyes(){S.shop=[];for(const k in S.plan)S.plan[k].forEach(e=>delete e.s);save();closeSheet();rerender()},
  copylist(){const t=listText();const fb=()=>sheet(`<h2>Your list</h2><p class="sub">Select and copy.</p><textarea rows="12" style="margin-top:10px" readonly aria-label="Shopping list text">${esc(t)}</textarea><div style="height:12px"></div><button class="btn w" data-a="closesheet">Close</button>`);
    try{navigator.clipboard.writeText(t).then(()=>toast('List copied'),fb)}catch(e){fb()}},
  closesheet(){closeSheet()},
  // adapt
  adaptsave(){saveAdapt()}
};

  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(C)stopCook();else if(D)ACT.closedetail()}});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.f;
  if(f==='additem'){const v=$('#newitem').value.trim();if(!v)return;addItem(v,'');save();rerender();const i=$('#newitem');if(i)i.focus()}

  if(f==='addavoid'){const v=$('#avoidq').value.trim();if(!v)return;const en=ident(v);if(!en){toast('Helth does not know that ingredient yet');return}if(!S.prefs.avoid.includes(en.k))S.prefs.avoid.push(en.k);save();sheetPrefs();$('.panel').style.animation='none'}});

  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=='object'||!o.prefs)throw 0;const key=S.spKey;S=norm(o);S.spKey=key;save();reindexCustom();restoreSp();closeSheet();render();toast('Backup restored')}catch(x){toast('That file is not a Helth backup')}};fr.readAsText(e.target.files[0])});

/* ---------- photo matching (Wikimedia, TheMealDB) ---------- */
/*PH-START*/
const PH={store:{},q:[],queued:new Set(),busy:0,pause:0,io:null,dirty:0};
const PH_STOP=new Set('easy best quick simple homemade classic perfect ultimate the a an of with and in on recipe style my our traditional authentic basic healthy and for'.split(' '));
const PH_GEN=new Set('chicken beef pork lamb fish egg eggs rice cheese bread salad soup cake pasta sauce meat potato vegetable fruit'.split(' '));
const PH_FOOD=/dish|food|soup|stew|bread|cake|pastr|pasta|sauce|dessert|cuisine|salad|sandwich|\bpie\b|curry|snack|beverage|drink|cookie|biscuit|dumpling|pancake|rice|noodle|meat|sausage|cheese|egg|fish|seafood|vegetable|fruit|confection|sweet|condiment|dip\b|spread|porridge|casserole|pudding|tart|omelet|roll\b|cocktail|meal|breakfast|dough|bake|pizza|burger|taco|wrap|stir|roast|steak|chop|fritter|loaf|muffin|scone|jam|chutney|pickle|ice cream|custard|mousse|risotto|paella|pilaf|bowl|kebab|skewer/i;
const PH_BAD=/logo|\bmap\b|flag|diagram|menu|restaurant|sign\b|market|stall|cover|book|poster|chart|icon|symbol|coat of arms|stamp|packag|label|shop|store|supermarket/i;
const phStem=w=>w.length>3&&/ies$/.test(w)?w.slice(0,-3)+'y':/oes$/.test(w)?w.slice(0,-2):w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;
const phToks=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w&&!PH_STOP.has(w)).map(phStem);
const phQ=t=>phToks(t).join(' ');
async function phGet(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(t)}}
const phLic=m=>{const L=((m&&m.LicenseShortName&&m.LicenseShortName.value)||'').trim();return L&&/^(CC0|CC[ -]BY|Public domain|PD\b)/i.test(L)&&!/\bNC\b|-NC|\bND\b|-ND|non-?commercial|no ?deriv|fair use|unfree/i.test(L)?L:''};
const phArtist=m=>(((m&&m.Artist&&m.Artist.value)||'').replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim().slice(0,60))||'unknown author';
const phFile=n=>'https://commons.wikimedia.org/wiki/'+encodeURI(String(n).replace(/ /g,'_'));
const WP='https://en.wikipedia.org/w/api.php?format=json&origin=*&',WC='https://commons.wikimedia.org/w/api.php?format=json&origin=*&';
const phMeta='&iiextmetadatafilter='+encodeURIComponent('LicenseShortName|Artist|AttributionRequired|ImageDescription');
async function phMdb(t){const d=await phGet('https://www.themealdb.com/api/json/v1/1/search.php?s='+encodeURIComponent(t));if(d===null)return undefined;
  const rt=phQ(t),m=(d.meals||[]).find(x=>phQ(x.strMeal)===rt&&x.strMealThumb);return m?{u:m.strMealThumb+'/medium',a:'TheMealDB',s:'mdb',l:'https://www.themealdb.com/meal/'+m.idMeal}:0}
async function phWiki(t){const rt=phToks(t);if(!rt.length)return 0;
  const d=await phGet(WP+'action=query&generator=search&gsrnamespace=0&gsrlimit=6&gsrsearch='+encodeURIComponent(phQ(t))+'&prop=pageimages|description&piprop=thumbnail|name&pithumbsize=640');if(d===null)return undefined;
  const ps=Object.values((d.query&&d.query.pages)||{}).filter(p=>p.thumbnail&&p.pageimage).sort((a,b)=>a.index-b.index);let best=null,bc=0;
  for(const p of ps){const pt=phToks(p.title);if(!pt.length||!pt.every(w=>rt.includes(w)))continue;const cov=pt.length/rt.length;if(cov<.5)continue;if(rt.length>1&&pt.length===1&&PH_GEN.has(pt[0]))continue;if(cov<1&&rt.slice(-pt.length).join(' ')!==pt.join(' '))continue;
    if(p.description?!PH_FOOD.test(p.description):pt.length<2)continue;if(/\.svg$/i.test(p.pageimage)||PH_BAD.test(p.pageimage))continue;if(cov>bc){best=p;bc=cov}}
  if(!best)return 0;
  const c=await phGet(WC+'action=query&prop=imageinfo&iiprop=extmetadata&titles='+encodeURIComponent('File:'+best.pageimage)+phMeta);if(c===null)return undefined;
  const pg=Object.values((c.query&&c.query.pages)||{})[0],m=pg&&pg.imageinfo&&pg.imageinfo[0]&&pg.imageinfo[0].extmetadata,L=phLic(m);
  return L?{u:best.thumbnail.source,a:phArtist(m),c:L,s:'wiki',l:phFile(best.pageimage)}:0}
async function phCommons(t){const rt=phToks(t);if(rt.length<2&&!rt.some(w=>w.length>4))return 0;
  const d=await phGet(WC+'action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch='+encodeURIComponent(phQ(t)+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=640'+phMeta);if(d===null)return undefined;
  const ps=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index);
  for(const p of ps){const i=p.imageinfo&&p.imageinfo[0];if(!i||!i.thumburl||i.mime!=='image/jpeg'||i.width<600||i.height<400)continue;
    const n=p.title.replace(/^File:/,'');if(PH_BAD.test(n))continue;const ft=phToks(n.replace(/\.[a-z]+$/i,'')+' '+(((i.extmetadata||{}).ImageDescription||{}).value||'').replace(/<[^>]*>/g,' ')),cov=rt.filter(w=>ft.includes(w)).length/rt.length;
    if(cov<.8)continue;const L=phLic(i.extmetadata);if(!L)continue;return{u:i.thumburl,a:phArtist(i.extmetadata),c:L,s:'commons',l:phFile(n)}}
  return 0}
async function phFind(t){let fail=0;for(const f of [phMdb,phWiki,phCommons]){const r=await f(t);if(r)return r;if(r===undefined)fail=1}return fail?undefined:0}
const phHas=r=>!r||r.url||r.p||r.img||r.mine||r.stub;
function phSave(){if(PH.dirty)return;PH.dirty=1;setTimeout(()=>{PH.dirty=0;idbSet('photos',PH.store)},1200)}
function phSwap(id,ph){document.querySelectorAll('.nop[data-pid="'+CSS.escape(id)+'"]').forEach(el=>{const im=new Image();im.className=el.className.replace('nop','').trim();im.alt='';im.src=ph.u;im.onload=()=>el.replaceWith(im);im.onerror=()=>{PH.store[id]={m:Date.now()};phSave()}})}
async function phRun(){if(PH.busy>=2||Date.now()<PH.pause)return;const id=PH.q.shift();if(!id)return;PH.busy++;
  try{const r=R[id];if(phHas(r)){return}const have=PH.store[id];if(have&&(have.u||Date.now()-have.m<14*864e5))return;
    const f=await phFind(r.t);if(f===undefined){PH.pause=Date.now()+60000;PH.queued.delete(id);return}
    PH.store[id]=f||{m:Date.now()};phSave();if(f)phSwap(id,f)}
  finally{PH.busy--;setTimeout(phRun,250)}}
function phWant(id){if(PH.queued.has(id))return;PH.queued.add(id);PH.q.push(id);phRun();phRun()}
function phScan(){if(!PH.io)return;document.querySelectorAll('.nop[data-pid]:not([data-po])').forEach(el=>{el.dataset.po=1;PH.io.observe(el)})}
async function phInit(){if(!('IntersectionObserver' in window)||!window.fetch)return;const s=await idbGet('photos');if(s&&typeof s==='object')PH.store=s;
  PH.io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){PH.io.unobserve(e.target);const id=e.target.dataset.pid,h=PH.store[id];if(h&&h.u){phSwap(id,h)}else phWant(id)}}),{rootMargin:'400px'});
  let t;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(phScan,120)}).observe(document.body,{childList:true,subtree:true});phScan()}
/*PH-END*/
